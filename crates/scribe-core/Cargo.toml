[package]
name = "gru953-scribe"
description = "Deterministic Bijoy/SutonnyMJ legacy Bangla to Unicode converter, with a reverse encoder used for accuracy measurement."
readme = "../../README.md"
keywords = ["bengali", "bangla", "bijoy", "sutonnymj", "unicode"]
categories = ["text-processing", "internationalization"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The embedded Bengali dictionary, stored as a finite-state automaton.
# This crate was dependency-free until Phase 1; half a million words is what
# changed that, and hand-rolling a compressed word set would be worse
# engineering rather than better. Unlicense/MIT, no transitive dependencies.
fst = "0.4"

[lints]
workspace = true
