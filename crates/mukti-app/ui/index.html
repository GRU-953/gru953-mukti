<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRU953 Mukti</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- Every string a person reads carries a data-i18n name, and app.js fills them
     all from one table on load. The words written below are only what shows if
     the script has not run.

     That matters more than it sounds. Until 13 August 2026 these attributes
     existed and nothing read them, so each string lived in two places at once
     with nothing keeping them in step - and the script meant to fill them in
     never ran at all, because it died on its first line. -->

<a class="skip" href="#input" data-i18n="skip">Skip to the text box</a>

<div class="shell">
  <!-- The Meridian rail. In light this is the one deep edge everything aligns
       to; in dark the whole window is Meridian and the rail is simply where the
       actions live. Either way it is the "single strong edge" the design rules
       ask for. -->
  <nav class="rail" data-i18n-label="railLabel" aria-label="Actions">
    <!-- The mark, unmodified, from the kit. 32px, so the bird itself is correct;
         below 24px the rules require the tile instead. -->
    <span class="rail-mark" aria-hidden="true"></span>

    <button type="button" id="open" class="rbtn">
      <span data-i18n="open">Open</span>
    </button>
    <button type="button" id="copy" class="rbtn">
      <span data-i18n="copy">Copy</span>
    </button>
    <button type="button" id="save" class="rbtn rbtn-primary">
      <span data-i18n="save">Save</span>
    </button>

    <button type="button" id="highlight" class="rbtn rail-end" aria-pressed="true">
      <span data-i18n="highlightShort">Changes</span>
    </button>
    <button type="button" id="theme" class="rbtn" aria-pressed="false">
      <span data-i18n="theme">Dark</span>
    </button>
  </nav>

  <main class="main">
    <header class="head">
      <h1 class="wordmark">GRU953 <span>Mukti</span></h1>
      <!-- The tagline is locked by the brand: both languages, complete, never
           reworded. So Bangla appears here whatever language the interface is
           in, and it is marked as Bangla so a screen reader does not attempt to
           pronounce it with English rules. -->
      <p class="tagline"><span lang="bn">সহজ প্রযুক্তি। সবার জন্য।</span><span class="sep" aria-hidden="true">·</span><span>Simple technology. For everyone.</span></p>
      <p class="lede" data-i18n="lede">Turn legacy Bangla into Unicode. Only the legacy words change.</p>
    </header>

    <section class="panes" data-i18n-label="panesLabel" aria-label="Convert text">
      <div class="pane">
        <div class="pane-head">
          <label for="input" data-i18n="inputLabel">Legacy Bangla</label>
          <span class="meta" id="filemeta" hidden></span>
        </div>
        <!-- lang="bn" because this is the box you paste Bangla into. It used to
             inherit English from <html>, which told a screen reader to read
             Bangla with an English voice and kept the Bangla font off the one
             field that most needs it. -->
        <textarea id="input" lang="bn" spellcheck="false" autocomplete="off"
          aria-describedby="drophint"
          data-i18n-placeholder="placeholder"
          placeholder="Paste text here, or drop a file anywhere on this window."></textarea>
        <p class="hint" id="drophint" data-i18n="drophint">Or drop a file on the window: text, Word, Excel, PowerPoint or PDF — including the older .doc, .xls and .ppt.</p>
      </div>

      <div class="pane">
        <div class="pane-head">
          <span id="outlabel" data-i18n="outputLabel">Unicode</span>
          <span class="meta count" id="count" hidden></span>
        </div>
        <!-- Not a textarea: converted words are marked up so you can see exactly
             what Mukti touched, rather than having to trust it.

             Deliberately NOT a live region. It used to be, and the whole pane was
             rebuilt on every pause in typing - so a screen reader read the entire
             document aloud again, and again, and raced the status line while
             doing it. A result you scroll through is somewhere to read, not
             something to announce. The short summary in #status announces.

             And no lang here. The result is a MIXTURE: converted Bangla plus
             English deliberately left alone. Declaring the whole pane Bangla made
             a screen reader read the English with a Bengali voice. app.js marks
             each converted word instead. -->
        <div id="output" class="output" tabindex="0" role="region"
             aria-labelledby="outlabel"></div>
        <p class="hint" id="outhint" hidden></p>
      </div>
    </section>

    <!-- The one place anything is announced. role="status" is already a polite
         live region, so it needs no aria-live of its own.

         Colour is never the only signal here: an error also carries an icon and
         the word, per the design rules. -->
    <p id="status" class="status" role="status">
      <b class="status-w" id="statusword" hidden></b><span id="statustext"></span>
    </p>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
