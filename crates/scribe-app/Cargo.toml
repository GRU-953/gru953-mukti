[package]
name = "scribe-app"
description = "GRU953 Scribe — the desktop app."
# Not published to crates.io: this is an application, not a library. It is
# distributed as a signed-in-future installer from the GitHub releases page,
# and it cannot build without system webkit packages anyway.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gru953-scribe = { path = "../scribe-core", version = "0.3.0" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
