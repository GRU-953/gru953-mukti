[workspace]
resolver = "2"
members = [
    "crates/mukti-core",
    "crates/mukti-cli",
    "crates/mukti-app",
    "crates/mukti-formats",
    "devtools/lexicon-build",
    "devtools/corpus-label",
    "devtools/corpus-verify",
    "devtools/eval",
]

# Shared metadata. Every crate in the workspace inherits these with
# `field.workspace = true`, so the version and licence are stated once.
[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/GRU-953/gru953-mukti"
authors = ["GRU953"]

[workspace.lints.clippy]
all = "warn"

[profile.release]
# The dictionary and the conversion tables are the bulk of the binary; a
# smaller binary matters more here than the last few percent of speed, and
# conversion is already far faster than any file we can read from disk.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
