# Build the command-line binary for Apple Silicon Macs.
#
# Runs only when a version tag is pushed, or when started by hand. It never
# runs on an ordinary commit.
#
# **macOS arm64 only, since 0.9.0.** Windows, Linux and Intel Macs were
# dropped in the same release that narrowed conversion to six Office
# formats — see CHANGELOG.md for the reasoning. The two-job Intel/ARM
# version this replaced was itself abandoned earlier: the Intel job needed
# a `macos-13` runner, and on a private repository those queued for half
# an hour without starting while the other jobs finished. That cost is
# gone along with the platforms.
#
# **Nothing here is signed.** Signing needs a paid Apple Developer account,
# and none is set up. The first time somebody opens the binary, macOS will
# warn them it is from an unidentified developer. That is expected, it is
# written in the release notes, and it is not a sign anything is wrong.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The compiler comes from rust-toolchain.toml, and from nowhere else.
      #
      # No toolchain action here, deliberately. Any action needs the version as an
      # input, which would put the number in two files and invite them to drift -
      # and CI installing "whatever stable is today" is exactly the unpinned
      # behaviour rust-toolchain.toml exists to end. `rustup toolchain install`
      # with no argument reads that file, including its components list, so this
      # step has no version in it at all.
      - name: Install the pinned toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Add the build target
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin
          rustup target list --installed

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The tests must pass on the machine that builds the binary, not
      # merely on some other machine earlier.
      - name: Test
        run: cargo test --workspace --release

      # The command-line tool, built for real, for exactly the one target
      # this now ships. An explicit --target rather than the runner's own
      # default: guessing among candidate output paths is how a single-
      # architecture binary once silently overwrote a universal one (see
      # the "Collect what was built" step below, and CHANGELOG.md).
      - name: Build the command-line tool
        run: cargo build --release -p mukti-cli --target aarch64-apple-darwin

      - name: Collect what was built
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          cp target/aarch64-apple-darwin/release/mukti out/mukti-macos

          # Prove the claim in the file name rather than asserting it.
          # `grep -qx` matches the whole line, which is what makes this an
          # assertion a fat (universal) binary would not also satisfy.
          lipo -archs "out/mukti-macos" | grep -qx "arm64" \
            || { echo "the binary is not arm64-only"; exit 1; }

          # No installers are collected, because none are built. The one
          # artefact is the binary named above.
          #
          # The check that replaces the installer count: the binary must
          # exist and must run. A release whose binary does not start is
          # worse than no release, and asserting the file is present says
          # nothing about that.
          chmod +x out/mukti-macos
          ./out/mukti-macos --version || { echo "the binary does not run"; exit 1; }
          echo "collected:"
          ls -la out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gru953-mukti-aarch64-apple-darwin
          path: out/*
          if-no-files-found: error

  publish:
    name: Attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Checked out for one reason: LICENSE and THIRD-PARTY-LICENSES are attached
      # to the release beside the binary. MIT and the dependency licences that MIT
      # cannot be elected in place of all require their notice to travel with the
      # software, and until 15 August 2026 a person who downloaded the binary and
      # never opened the repository received none of them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            LICENSE
            THIRD-PARTY-LICENSES
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: all
      - name: Check the notices are actually there before drafting
        run: |
          set -euo pipefail
          for f in LICENSE THIRD-PARTY-LICENSES; do
            [ -s "$f" ] || { echo "$f is missing or empty; the release would ship without its notices"; exit 1; }
          done
          echo "notices present:"; ls -la LICENSE THIRD-PARTY-LICENSES
      - name: Draft the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            all/**/*
            LICENSE
            THIRD-PARTY-LICENSES
          # A draft, never a live release. Publishing is a decision a person
          # makes, after reading the notes and running the binary.
          draft: true
          generate_release_notes: true
