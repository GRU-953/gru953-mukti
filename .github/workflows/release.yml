# Build the installers for macOS, Windows and Ubuntu.
#
# Runs only when a version tag is pushed, or when started by hand. It never
# runs on an ordinary commit: building three platforms takes real minutes, and
# on a private repository those minutes come out of your account's quota.
#
# **Nothing here is signed.** Signing needs a paid Apple Developer account and
# a Windows certificate, and neither is set up. The first time somebody opens
# the app their operating system will warn them it is from an unidentified
# developer. That is expected, it is written in the release notes, and it is
# not a sign anything is wrong.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONE universal Mac build covering both architectures, rather than a
          # separate job per architecture.
          #
          # The two-job version was tried and abandoned: the Intel job needs a
          # `macos-13` runner, and on a private repository those are scarce
          # enough that it sat queued for half an hour without starting while
          # the other three finished. A universal binary needs no scarce
          # runner, produces one file for users to choose between instead of
          # two, and is what Apple expects anyway.
          - os: macos-latest
            label: macOS (universal)
            target: universal-apple-darwin
            extra-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            label: Ubuntu
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            label: Windows
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The compiler comes from rust-toolchain.toml, and from nowhere else.
      #
      # No toolchain action here, deliberately. Any action needs the version as an
      # input, which would put the number in two files and invite them to drift -
      # and CI installing "whatever stable is today" is exactly the unpinned
      # behaviour rust-toolchain.toml exists to end. `rustup toolchain install`
      # with no argument reads that file, including its components list, so this
      # step has no version in it at all.
      - name: Install the pinned toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      # A universal build is assembled from both real Apple targets;
      # `universal-apple-darwin` is not itself something rustup installs.
      - name: Add the build targets
        shell: bash
        run: |
          IFS=',' read -ra targets <<< "${{ matrix.extra-targets || matrix.target }}"
          for t in "${targets[@]}"; do rustup target add "$t"; done
          rustup target list --installed

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Ubuntu 22.04 rather than latest: the webkit2gtk package name changed,
      # and pinning it here means a release does not break the day the runner
      # image moves on.
      - name: Install the desktop app's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf build-essential file

      # The tests must pass on the machine that builds the installer, not
      # merely on some other machine earlier.
      - name: Test
        run: cargo test --workspace --release

      # The command-line tool, built for real.
      #
      # On macOS it is built for BOTH architectures and joined with lipo. The
      # first attempt built it only for the runner's own architecture and then
      # named the artefact "universal", which was a lie an Intel Mac user would
      # discover by downloading a file that would not run. The app bundle was
      # genuinely universal; only this was not.
      - name: Build the command-line tool
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cargo build --release -p mukti-cli --target aarch64-apple-darwin
            cargo build --release -p mukti-cli --target x86_64-apple-darwin
            mkdir -p target/universal-apple-darwin/release
            lipo -create -output target/universal-apple-darwin/release/mukti \
              target/aarch64-apple-darwin/release/mukti \
              target/x86_64-apple-darwin/release/mukti
            lipo -archs target/universal-apple-darwin/release/mukti
          else
            cargo build --release -p mukti-cli
          fi

      - name: Build the app installer
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          projectPath: crates/mukti-app
          args: --target ${{ matrix.target }}

      - name: Collect what was built
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          # The command-line tool, under a name that says which machine it is for.
          #
          # ONE named source per platform, not a loop over candidates. The loop
          # this replaces built its destination with ${f##*mukti}, which is empty
          # for BOTH `target/universal-apple-darwin/release/mukti` and
          # `target/release/mukti` — so on macOS the second silently overwrote the
          # first with a single-architecture binary. It had not bitten yet only
          # because `cargo test` does not emit `target/release/mukti` while there
          # is no tests/ directory in the workspace. Adding one would have broken
          # the macOS release, and a tests/ directory is exactly what comes next.
          #
          # Fixed by naming the file we mean instead of guessing among three.
          case "${{ runner.os }}" in
            macOS)
              cp target/universal-apple-darwin/release/mukti \
                 "out/mukti-${{ matrix.target }}"
              ;;
            Windows)
              cp target/release/mukti.exe "out/mukti-${{ matrix.target }}.exe"
              ;;
            *)
              cp target/release/mukti "out/mukti-${{ matrix.target }}"
              ;;
          esac

          # Prove the claim in the file name rather than asserting it.
          if [ "${{ runner.os }}" = "macOS" ]; then
            lipo -archs "out/mukti-${{ matrix.target }}" | grep -q "x86_64 arm64" \
              || { echo "the universal binary is not universal"; exit 1; }
          fi

          # Installers, wherever this platform's bundler put them.
          #
          # .rpm is included: bundle.targets is "all", so Linux builds one, and it
          # was being built and then silently dropped.
          #
          # And no `|| true` on the end. That swallowed a total failure to find any
          # installer at all — and `if-no-files-found: error` on the upload would
          # still have passed, because the command-line binary was in out/. So a
          # release with no installers in it could look completely green.
          find target -path '*/release/bundle/*' \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' \
               -o -name '*.AppImage' -o -name '*.rpm' \) \
            -exec cp {} out/ \;

          # Say what an installer actually is on this platform, and fail if none
          # arrived. Counting is the check; listing is for a human reading the log.
          installers=$(find out -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' \
               -o -name '*.AppImage' -o -name '*.rpm' \) | wc -l | tr -d ' ')
          if [ "$installers" -eq 0 ]; then
            echo "no installer was produced for ${{ matrix.target }}"
            exit 1
          fi
          echo "$installers installer(s) for ${{ matrix.target }}:"
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gru953-mukti-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: all
      - name: Draft the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: all/**/*
          # A draft, never a live release. Publishing is a decision a person
          # makes, after reading the notes and trying at least one installer.
          draft: true
          generate_release_notes: true
