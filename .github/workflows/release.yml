# Build the installers for macOS, Windows and Ubuntu.
#
# Runs only when a version tag is pushed, or when started by hand. It never
# runs on an ordinary commit: building three platforms takes real minutes, and
# on a private repository those minutes come out of your account's quota.
#
# **Nothing here is signed.** Signing needs a paid Apple Developer account and
# a Windows certificate, and neither is set up. The first time somebody opens
# the app their operating system will warn them it is from an unidentified
# developer. That is expected, it is written in the release notes, and it is
# not a sign anything is wrong.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONE universal Mac build covering both architectures, rather than a
          # separate job per architecture.
          #
          # The two-job version was tried and abandoned: the Intel job needs a
          # `macos-13` runner, and on a private repository those are scarce
          # enough that it sat queued for half an hour without starting while
          # the other three finished. A universal binary needs no scarce
          # runner, produces one file for users to choose between instead of
          # two, and is what Apple expects anyway.
          - os: macos-latest
            label: macOS (universal)
            target: universal-apple-darwin
            extra-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            label: Ubuntu
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            label: Windows
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal build is assembled from both real targets, and
          # `universal-apple-darwin` is not itself something rustup installs.
          targets: ${{ matrix.extra-targets || matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # Ubuntu 22.04 rather than latest: the webkit2gtk package name changed,
      # and pinning it here means a release does not break the day the runner
      # image moves on.
      - name: Install the desktop app's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf build-essential file

      # The tests must pass on the machine that builds the installer, not
      # merely on some other machine earlier.
      - name: Test
        run: cargo test --workspace --release

      # The command-line tool, built for real.
      #
      # On macOS it is built for BOTH architectures and joined with lipo. The
      # first attempt built it only for the runner's own architecture and then
      # named the artefact "universal", which was a lie an Intel Mac user would
      # discover by downloading a file that would not run. The app bundle was
      # genuinely universal; only this was not.
      - name: Build the command-line tool
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cargo build --release -p scribe-cli --target aarch64-apple-darwin
            cargo build --release -p scribe-cli --target x86_64-apple-darwin
            mkdir -p target/universal-apple-darwin/release
            lipo -create -output target/universal-apple-darwin/release/scribe \
              target/aarch64-apple-darwin/release/scribe \
              target/x86_64-apple-darwin/release/scribe
            lipo -archs target/universal-apple-darwin/release/scribe
          else
            cargo build --release -p scribe-cli
          fi

      - name: Build the app installer
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: crates/scribe-app
          args: --target ${{ matrix.target }}

      - name: Collect what was built
        shell: bash
        run: |
          mkdir -p out
          # The command-line tool, under a name that says which machine it is for.
          for f in target/universal-apple-darwin/release/scribe \
                   target/release/scribe target/release/scribe.exe; do
            [ -f "$f" ] && cp "$f" "out/scribe-${{ matrix.target }}${f##*scribe}"
          done
          # Prove the claim in the file name rather than asserting it.
          if [ "${{ runner.os }}" = "macOS" ]; then
            lipo -archs out/scribe-universal-apple-darwin | grep -q "x86_64 arm64" \
              || { echo "the universal binary is not universal"; exit 1; }
          fi
          # Installers, wherever this platform's bundler put them.
          find target -path '*/release/bundle/*' \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} out/ \; 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: gru953-scribe-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
      - name: Draft the release
        uses: softprops/action-gh-release@v2
        with:
          files: all/**/*
          # A draft, never a live release. Publishing is a decision a person
          # makes, after reading the notes and trying at least one installer.
          draft: true
          generate_release_notes: true
