# Build and test GRU953 Mukti on all three platforms it ships to.
#
# Running the matrix from the very first commit is deliberate: a break that
# only shows on Windows or Ubuntu is caught the day it lands, not months later
# when the first release is built and nobody remembers what changed.
#
# This workflow publishes nothing and holds no secrets.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Formatting and lints are platform-independent, so they run once rather
  # than three times.
  check:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The compiler comes from rust-toolchain.toml, and from nowhere else.
      #
      # No toolchain action here, deliberately. Any action needs the version as an
      # input, which would put the number in two files and invite them to drift -
      # and CI installing "whatever stable is today" is exactly the unpinned
      # behaviour rust-toolchain.toml exists to end. `rustup toolchain install`
      # with no argument reads that file, including its components list, so this
      # step has no version in it at all.
      - name: Install the pinned toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel the other platforms when one fails: knowing whether a
      # failure is on all three or only one is most of the diagnosis.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The compiler comes from rust-toolchain.toml, and from nowhere else.
      #
      # No toolchain action here, deliberately. Any action needs the version as an
      # input, which would put the number in two files and invite them to drift -
      # and CI installing "whatever stable is today" is exactly the unpinned
      # behaviour rust-toolchain.toml exists to end. `rustup toolchain install`
      # with no argument reads that file, including its components list, so this
      # step has no version in it at all.
      - name: Install the pinned toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
