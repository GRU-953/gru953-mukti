# Build and test GRU953 Scribe on all three platforms it ships to.
#
# Running the matrix from the very first commit is deliberate: a break that
# only shows on Windows or Ubuntu is caught the day it lands, not months later
# when the first installer is built and nobody remembers what changed.
#
# This workflow publishes nothing and holds no secrets.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # The desktop app draws through the operating system's own web view. On
  # macOS and Windows that is already present; on Ubuntu it is a package, and
  # without it the app crate will not compile at all.
  LINUX_DEPS: >-
    sudo apt-get update &&
    sudo apt-get install -y
    libwebkit2gtk-4.1-dev
    libayatana-appindicator3-dev
    librsvg2-dev
    libxdo-dev
    libssl-dev
    patchelf
    build-essential
    file

jobs:
  # Formatting and lints are platform-independent, so they run once rather
  # than three times.
  check:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install the desktop app's Linux dependencies
        run: ${{ env.LINUX_DEPS }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel the other platforms when one fails: knowing whether a
      # failure is on all three or only one is most of the diagnosis.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the desktop app's Linux dependencies
        if: runner.os == 'Linux'
        run: ${{ env.LINUX_DEPS }}
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
