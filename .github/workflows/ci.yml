# Build and test Mukti by GRU953 on macOS, the one platform it ships to.
#
# Reduced from three platforms to one on 20 August 2026, in the same release
# that narrowed conversion to six Office formats and dropped Windows, Linux
# and Intel Macs from the release workflow — see CHANGELOG.md. The
# consequence is worth stating rather than burying: a portability break in
# `gru953-mukti` or `mukti-formats` would now go unnoticed here. Both are
# still ordinary Rust with no platform-specific code, and HANDOVER.md
# records a plan to publish them to crates.io, where they would meet other
# platforms again without this workflow's help.
#
# This workflow publishes nothing and holds no secrets.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Warnings-as-errors moved to .cargo/config.toml on 20 August 2026, because
  # RUSTFLAGS in the environment silently overrides that file instead of
  # merging with it -- and the release workflow, which never set this
  # variable, was the one build that did not enforce it. One place now, for
  # every build. Do not re-add this variable here; the guard step below fails
  # the run if it comes back.

jobs:
  # Formatting and lints are platform-independent, so this stays on Ubuntu —
  # cheaper and no slower — even though `test` below is macOS-only. That is
  # a deliberate difference, not drift: nothing about `cargo fmt` or
  # `cargo clippy`'s verdict depends on which OS runs them.
  check:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The compiler comes from rust-toolchain.toml, and from nowhere else.
      #
      # No toolchain action here, deliberately. Any action needs the version as an
      # input, which would put the number in two files and invite them to drift -
      # and CI installing "whatever stable is today" is exactly the unpinned
      # behaviour rust-toolchain.toml exists to end. `rustup toolchain install`
      # with no argument reads that file, including its components list, so this
      # step has no version in it at all.
      - name: Install the pinned toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # `.cargo/config.toml` is the one place warnings-as-errors is set. A
      # `RUSTFLAGS` environment variable would silently override it rather
      # than merge with it, which is exactly the arrangement that once let
      # the release workflow ship without this enforced at all. This is the
      # backstop against that coming back.
      - name: RUSTFLAGS must not be set in the environment
        run: |
          if [ -n "${RUSTFLAGS:-}" ]; then
            echo "RUSTFLAGS is set to '$RUSTFLAGS'. Warnings-as-errors belongs in .cargo/config.toml, not the environment: a RUSTFLAGS variable overrides that file instead of merging with it."
            exit 1
          fi
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The compiler comes from rust-toolchain.toml, and from nowhere else.
      #
      # No toolchain action here, deliberately. Any action needs the version as an
      # input, which would put the number in two files and invite them to drift -
      # and CI installing "whatever stable is today" is exactly the unpinned
      # behaviour rust-toolchain.toml exists to end. `rustup toolchain install`
      # with no argument reads that file, including its components list, so this
      # step has no version in it at all.
      - name: Install the pinned toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  # Every commit here is the owner's work, under one identity. This job exists
  # because the sibling MTA project learned the cost the hard way: four commits
  # reached its branch in August 2026 crediting an assistant as co-author,
  # because nothing in that repository forbade it. Clearing them rewrote every
  # hash on the branch and forced a push, and one commit could not be cleaned at
  # all - GitHub pins pull-request tips at refs/pull/N/head permanently. Mukti's
  # history is clean today; this keeps it that way.
  #
  # The identity check is an ALLOW-list on purpose. Listing the addresses that
  # must not appear would write them into a tracked file in a public repository,
  # which is the opposite of the point. Offending COMMITS are printed, never
  # addresses. `.githooks/` refuses both before a commit exists; this is the
  # backstop for a clone that never ran `git config core.hooksPath .githooks`.
  attribution:
    name: Commit attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Refuse AI co-author trailers and stray identities
        shell: bash
        run: |
          set -euo pipefail
          trailers=$(git log --format='%H %s%n%b' \
            | grep -iE '^[[:space:]]*co-authored-by:.*(claude|anthropic|copilot|chatgpt|openai|gemini|cursor)' \
            || true)
          if [ -n "$trailers" ]; then
            echo "::error::AI co-author trailers found in commit messages:"
            echo "$trailers"
            exit 1
          fi
          strays=$(git log --format='%H %ae %ce' \
            | awk '$2 != "225374119+GRU-953@users.noreply.github.com" \
                || $3 != "225374119+GRU-953@users.noreply.github.com" { print $1 }' \
            || true)
          if [ -n "$strays" ]; then
            echo "::error::Commits authored under an unapproved identity:"
            echo "$strays"
            echo "Expected 225374119+GRU-953@users.noreply.github.com."
            exit 1
          fi
          echo "Commit attribution is clean across $(git rev-list --count HEAD) commits."
